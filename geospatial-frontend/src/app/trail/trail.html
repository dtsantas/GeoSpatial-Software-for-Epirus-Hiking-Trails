<p-confirmDialog></p-confirmDialog>

<div *ngIf="trail; else loading" class="trail-page">

  <!-- LEFT COLUMN -->
  <div class="trail-sidebar">

    <p-card>

      <ng-template #header>
        <img
          [src]="trail.image"
          class="header-img"
        />
      </ng-template>

      <ng-template #title>
        <div class="title">{{ trail.trailName }}</div>
      </ng-template>

      <div class="trail-info">
        <div><strong>📍 Location:</strong> {{ trail.location }}</div>
        <div><strong>📏 Length:</strong> {{ trail.lengthKm }} km</div>
        <div><strong>⏱ Duration:</strong> {{ trail.duration }} H</div>
        <div><strong>🔥 Difficulty:</strong> {{ trail.difficulty }}</div>
      </div>

      <div class="description">
        <strong>Description</strong>
        <p>{{ trail.description }}</p>
      </div>

      <div class="actions">

        <button
          pButton
          label="Create Review"
          icon="pi pi-pencil"
          (click)="createReview(trail.id!)">
        </button>

        <button
          pButton
          label="Reviews"
          icon="pi pi-comments"
          class="p-button-secondary"
          (click)="getReviews(trail.id!)">
        </button>

        <button
          *ngIf="userService.getRole() === 'ROLE_ADMIN' || userService.getUser() === trail.email"
          pButton
          label="Delete"
          icon="pi pi-trash"
          class="p-button-danger"
          (click)="confirmDeleteTrail(trail.id!)">
        </button>

      </div>

    </p-card>

  </div>

  <!-- RIGHT COLUMN -->
  <div class="trail-map-editor">

<app-trail-map-editor
  [trailId]="trail.id!"
  [hasGpxFile]="trail.hasGpxFile">
</app-trail-map-editor>

  </div>

</div>

<ng-template #loading>
  <div class="loading">
    <p-progressSpinner></p-progressSpinner>
  </div>
</ng-template>

<!-- PHOTOS -->

<div class="photos-header">

  <h3 class="photos-title">📸 Photos</h3>

  <div
    *ngIf="trail && (userService.getRole() === 'ROLE_ADMIN' || userService.getUser() === trail.email)"
    class="upload-area">

    <label
      class="upload-trigger"
      [class.selected]="selectedImages.length > 0">

      Add Photos

      <input
        type="file"
        multiple
        accept="image/*"
        hidden
        (change)="onImagesSelect($event)">

    </label>

    <button
      class="upload-btn"
      [class.visible]="selectedImages.length > 0"
      (click)="addImages(trail.id!)">

      Upload

    </button>

  </div>

</div>

<p-carousel
  [value]="images"
  [numVisible]="1"
  [numScroll]="1"
  [circular]="true">

  <ng-template pTemplate="item" let-img>

    <div class="carousel-item">

      <img
        [src]="img.imageURL"
        class="carousel-img"
        (click)="openGallery(img)"
        style="cursor: zoom-in;">

      <button
        *ngIf="userService.getRole() === 'ROLE_ADMIN'"
        pButton
        class="delete-photo-btn"
        (click)="confirmDeleteImage(img.id)">

        ✕

      </button>

    </div>

  </ng-template>

</p-carousel>
<p-galleria
  [value]="images"
  [(visible)]="galleryVisible"
  [(activeIndex)]="galleryIndex"
  [fullScreen]="true"
  [showItemNavigators]="true"
  [showThumbnails]="false"
  [circular]="true"
  [containerStyle]="{ 'max-width': '90vw' }">

  <ng-template pTemplate="item" let-img>

    <img
      [src]="img.imageURL"
      class="fullscreen-img">

  </ng-template>

</p-galleria>
