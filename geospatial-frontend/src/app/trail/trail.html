<p-confirmDialog></p-confirmDialog>

<div *ngIf="trail; else loading" class="trail-page">

  <!-- LEFT COLUMN -->
  <div class="trail-sidebar">

    <p-card>

      <ng-template #header>
        <img
          [src]="trail.image"
          class="header-img"
        />
      </ng-template>

      <ng-template #title>
        <div class="title">{{ trail.trailName }}</div>
      </ng-template>

      <div class="trail-info">
        <div><strong>📍 Location:</strong> {{ trail.location }}</div>
        <div><strong>📏 Length:</strong> {{ trail.lengthKm }} km</div>
        <div><strong>⏱ Duration:</strong> {{ trail.duration }} H</div>
        <div><strong>🔥 Difficulty:</strong> {{ trail.difficulty }}</div>
      </div>

      <div class="description">
        <strong>Description</strong>
        <p>{{ trail.description }}</p>
      </div>

      <div class="actions">

        <button
          pButton
          label="Create Review"
          icon="pi pi-pencil"
          (click)="createReview(trail.id!)">
        </button>

        <button
          pButton
          label="Reviews"
          icon="pi pi-comments"
          class="p-button-secondary"
          (click)="getReviews(trail.id!)">
        </button>

        <button
        *ngIf="userService.getRole() === 'ROLE_ADMIN'"
        pButton
        label="Edit Trail"
        icon="pi pi-pencil"
        class="p-button-warning"
        (click)="openEditDialog()">
      </button>

        <button
          *ngIf="userService.getRole() === 'ROLE_ADMIN' || userService.getUser() === trail.email"
          pButton
          label="Delete"
          icon="pi pi-trash"
          class="p-button-danger"
          (click)="confirmDeleteTrail(trail.id!)">
        </button>

      </div>

    </p-card>

  </div>

  <!-- RIGHT COLUMN -->
  <div class="trail-map-editor">

<app-trail-map-editor
  [trailId]="trail.id!"
  [hasGpxFile]="trail.hasGpxFile">
</app-trail-map-editor>

  </div>

</div>

<ng-template #loading>
  <div class="loading">
    <p-progressSpinner></p-progressSpinner>
  </div>
</ng-template>

<!-- PHOTOS -->

<div class="photos-header">

  <h3 class="photos-title">📸 Photos</h3>

  <div
    *ngIf="trail && (userService.getRole() === 'ROLE_ADMIN' || userService.getUser() === trail.email)"
    class="upload-area">

    <label
      class="upload-trigger"
      [class.selected]="selectedImages.length > 0">

      Add Photos

      <input
        type="file"
        multiple
        accept="image/*"
        hidden
        (change)="onImagesSelect($event)">

    </label>

    <button
      class="upload-btn"
      [class.visible]="selectedImages.length > 0"
      (click)="addImages(trail.id!)">

      Upload

    </button>

  </div>

</div>

<p-carousel
  [value]="images"
  [numVisible]="1"
  [numScroll]="1"
  [circular]="true">

  <ng-template pTemplate="item" let-img>

    <div class="carousel-item">

      <img
        [src]="img.imageURL"
        class="carousel-img"
        (click)="openGallery(img)"
        style="cursor: zoom-in;">

      <button
        *ngIf="userService.getRole() === 'ROLE_ADMIN'"
        pButton
        class="delete-photo-btn"
        (click)="confirmDeleteImage(img.id)">

        ✕

      </button>

    </div>

  </ng-template>

</p-carousel>
<p-dialog
  header="Trail Photos"
  [(visible)]="galleryVisible"
  [modal]="true"
  [dismissableMask]="true"
  [style]="{ width: '95vw', maxWidth: '1100px' }"
  [contentStyle]="{ padding: '10px' }"
  appendTo="body">

  <div class="lightbox-content" *ngIf="images.length > 0">

    <button
      type="button"
      pButton
      icon="pi pi-chevron-left"
      class="lightbox-arrow"
      [disabled]="images.length <= 1"
      (click)="previousImage()">
    </button>

    <img
      [src]="images[galleryIndex].imageURL"
      class="lightbox-img">

    <button
      type="button"
      pButton
      icon="pi pi-chevron-right"
      class="lightbox-arrow"
      [disabled]="images.length <= 1"
      (click)="nextImage()">
    </button>

  </div>

  <div class="lightbox-counter" *ngIf="images.length > 0">
    {{ galleryIndex + 1 }} / {{ images.length }}
  </div>

</p-dialog>

<p-dialog
  header="Edit Trail"
  [(visible)]="editVisible"
  [modal]="true"
  [style]="{ width: '32rem', maxWidth: '95vw' }">

  <form
    #editForm="ngForm"
    (ngSubmit)="saveTrail()"
    class="edit-trail-form">

    <label for="editName">Trail Name</label>
    <input
      id="editName"
      name="name"
      type="text"
      required
      [(ngModel)]="editData.name">

    <label for="editLocation">Location</label>
    <input
      id="editLocation"
      name="location"
      type="text"
      required
      [(ngModel)]="editData.location">

    <label for="editDuration">Duration (hours)</label>
    <input
      id="editDuration"
      name="duration"
      type="number"
      min="0.01"
      step="0.1"
      required
      [(ngModel)]="editData.duration">

    <label for="editDifficulty">Difficulty</label>
    <select
      id="editDifficulty"
      name="difficulty"
      [(ngModel)]="editData.difficulty">
      <option value="Easy">Easy</option>
      <option value="Mid">Mid</option>
      <option value="Hard">Hard</option>
    </select>

    <label for="editDescription">Description</label>
    <textarea
      id="editDescription"
      name="description"
      rows="4"
      maxlength="2000"
      [(ngModel)]="editData.description">
    </textarea>

    <p *ngIf="editError" class="edit-error">
      {{ editError }}
    </p>

    <div class="edit-trail-actions">
      <button
        type="button"
        pButton
        label="Cancel"
        class="p-button-secondary"
        [disabled]="savingEdit"
        (click)="editVisible = false">
      </button>

      <button
        type="submit"
        pButton
        label="Save Changes"
        icon="pi pi-check"
        [disabled]="editForm.invalid || savingEdit">
      </button>
    </div>

  </form>
</p-dialog>
